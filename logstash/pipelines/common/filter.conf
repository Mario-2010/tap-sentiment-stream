# FILTER comune: tiene solo i campi utili e normalizza lo schema dell'evento.
filter {
  # Risposte non valide (es. errore HTTP non JSON) o boost/reblog: scartati
  if ![id] or [reblog] {
    drop {}
  }
  # Il modello di sentiment usato e' addestrato su testo inglese
  if [language] != "en" {
    drop {}
  }

  ruby {
    code => '
      # Logstash riserva il campo "tags" alle sue etichette: se arriva un array di oggetti
      # (come i tag di Mastodon) lo sposta in "_tags" e aggiunge "_tagsparsefailure"
      tags = event.get("_tags") || event.get("tags")
      hashtags = tags.is_a?(Array) ? tags.map { |t| t.is_a?(Hash) ? t["name"].to_s.downcase : nil }.compact : []
      event.set("author", event.get("[account][acct]"))
      event.set("content_html", event.get("content"))
      keep = %w[id created_at content_html language url author source replies_count reblogs_count favourites_count]
      event.to_hash.keys.each { |k| event.remove(k) unless keep.include?(k) || k.start_with?("@") }
      event.set("hashtags", hashtags)
    '
  }
}
