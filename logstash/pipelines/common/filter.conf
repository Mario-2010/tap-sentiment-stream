# FILTER comune: tiene solo i campi utili e normalizza lo schema dell'evento.
filter {
  # Risposte non valide (es. errore HTTP non JSON) o boost/reblog: scartati
  if ![id] or [reblog] {
    drop {}
  }
  # Il modello di sentiment usato e' addestrato su testo inglese
  if [language] != "en" {
    drop {}
  }

  ruby {
    code => '
      # Logstash riserva il campo "tags" alle sue etichette: un array di oggetti (i tag di Mastodon)
      # viene spostato in "_tags". Per sicurezza gli hashtag si ricavano anche dai link /tags/<nome> del testo.
      raw = [event.get("_tags"), event.get("tags")].select { |v| v.is_a?(Array) }.flatten
      hashtags = raw.map { |t| (t["name"] rescue nil) unless t.is_a?(String) }.compact.map { |t| t.to_s.downcase }
      if hashtags.empty?
        hashtags = event.get("content").to_s.scan(%r{/tags/([^"?#/<>\s]+)}).flatten.map(&:downcase)
      end
      hashtags = hashtags.uniq
      event.set("author", event.get("[account][acct]"))
      event.set("content_html", event.get("content"))
      keep = %w[id created_at content_html language url author source replies_count reblogs_count favourites_count]
      event.to_hash.keys.each { |k| event.remove(k) unless keep.include?(k) || k.start_with?("@") }
      event.set("hashtags", hashtags)
    '
  }
}
