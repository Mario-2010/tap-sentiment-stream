# OUTPUT comune: pubblica su Kafka. La chiave e' l'id del post, quindi lo stesso post
# finisce sempre nella stessa partizione (ordinamento per chiave).
output {
  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id => "mastodon-posts"
    message_key => "%{id}"
    codec => json
    acks => "all"
  }
}
