# INPUT "mastodon": interroga periodicamente la timeline pubblica di un'istanza Mastodon.
# L'API restituisce un array JSON: il codec json crea un evento per ogni elemento.
input {
  http_poller {
    urls => {
      mastodon => {
        method => get
        url => "${MASTODON_URL}/api/v1/timelines/public?limit=40"
        headers => { "Accept" => "application/json" }
      }
    }
    schedule => { "every" => "${POLL_INTERVAL}" }
    request_timeout => 30
    codec => "json"
    add_field => { "source" => "mastodon" }
  }
}
