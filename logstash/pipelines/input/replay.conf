# INPUT "replay": legge (in tail) il file scritto dal container "replayer".
# Stesso formato JSON dell'API Mastodon, cosi' il resto della pipeline non cambia.
input {
  file {
    path => "/stream/stream.jsonl"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => { "source" => "replay" }
  }
}
